name: matched-interpretability-certification

on:
  workflow_dispatch:
  schedule:
  - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  full-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      CROSSFORM_FULL_MATCHED_SIMULATION: "true"
    steps:
    - uses: actions/checkout@v4
    - uses: r-lib/actions/setup-r@v2
      with:
        extra-repositories: https://bbuchsbaum.r-universe.dev
        use-public-rspm: true
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: any::devtools
        needs: check
    - name: Rebuild numeric certification artifacts
      run: Rscript benchmarks/matched-interpretability/05-certify.R
    - name: Verify committed artifacts are reproducible
      run: |
        git diff --exit-code -- \
          inst/extdata/certification/matched-interpretability-parameters.csv \
          inst/extdata/certification/matched-interpretability-truth.csv \
          inst/extdata/certification/matched-interpretability-summary.csv \
          inst/extdata/certification/matched-interpretability-metrics.csv \
          inst/extdata/certification/matched-interpretability-checksums.csv
    - name: Run the full semantic court
      run: Rscript -e 'devtools::test(filter = "matched-interpretability-certification", reporter = "summary")'
