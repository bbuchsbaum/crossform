name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only the main-branch and release builds publish; pull requests build the
    # site as a check that articles still render.
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: r-lib/actions/setup-pandoc@v2
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        # Same non-CRAN universe as the check court; vignettes and articles are
        # rendered against an installed crossform.
        extra-repositories: https://bbuchsbaum.r-universe.dev
        extra-packages: any::pkgdown, local::.
        needs: website
    - name: Build the site
      run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
      shell: Rscript {0}
    - name: Deploy to GitHub Pages
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4.6.4
      with:
        clean: false
        branch: gh-pages
        folder: docs
