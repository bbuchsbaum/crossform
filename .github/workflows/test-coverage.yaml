name: test-coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Coverage measures the fast suite only. The scale gates run in their own
      # scheduled court and would dominate the runtime here without adding
      # covered lines that the fast suite does not already reach.
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
    - uses: actions/checkout@v4
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-repositories: https://bbuchsbaum.r-universe.dev
        extra-packages: any::covr, any::xml2
        needs: coverage
    - name: Measure coverage
      run: |
        cov <- covr::package_coverage(
          quiet = FALSE,
          clean = FALSE,
          install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
        )
        print(cov)
        covr::to_cobertura(cov)
      shell: Rscript {0}
    - uses: codecov/codecov-action@v4
      with:
        # A missing token on a fork must not fail the court; a main-branch
        # upload failure is a real signal.
        fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
        files: ./cobertura.xml
        plugins: noop
        disable_search: true
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Show testthat output
      if: always()
      run: find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
      shell: bash
    - name: Upload the failing test artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-test-failures
        path: ${{ runner.temp }}/package
