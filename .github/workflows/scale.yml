name: Scale gates

on:
  workflow_dispatch:
  schedule:
  - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EFFECTAGRAM_RUN_SCALE_TESTS: "true"
    steps:
    - uses: actions/checkout@v4
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        # The scale court does not consume the optional first-level adapters.
        # Keep exact-version fmridesign/fmrireg Suggests out of dependency
        # resolution and install only the explicit court tools beside hard
        # package dependencies.
        dependencies: 'c("Depends", "Imports", "LinkingTo")'
        extra-packages: any::devtools, any::processx, any::ps, any::testthat
    - name: Record the exact source revision
      run: |
        Rscript -e 'dir.create("hosted-results", showWarnings = FALSE); writeLines(c(paste("source_revision", Sys.getenv("GITHUB_SHA")), capture.output(sessionInfo())), "hosted-results/session-info.txt")'
    - name: Run the public map and covariance gate
      run: Rscript benchmarks/run-public-map-scale-gate.R . hosted-results
    - name: Run the query-first scale gate
      run: Rscript benchmarks/run-query-first-scale.R . hosted-results
    - name: Run the 50k topology gates
      run: |
        Rscript -e 'testthat::test_dir("tests/testthat", filter = "support-index", load_package = "source", stop_on_failure = TRUE, stop_on_warning = TRUE); writeLines(c(paste("source_revision", Sys.getenv("GITHUB_SHA")), "support_index_50000 PASS", "searchlight_neighbors_50000 PASS"), "hosted-results/topology-gates.txt")'
    - name: Upload scale receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scale-receipts-${{ github.sha }}
        path: hosted-results/
        if-no-files-found: warn
