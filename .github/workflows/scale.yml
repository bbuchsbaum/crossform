name: Scale gates

on:
  workflow_dispatch:
  schedule:
  - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EFFECTAGRAM_RUN_SCALE_TESTS: "true"
    steps:
    - uses: actions/checkout@v4
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: any::devtools, any::processx, any::ps
        needs: check
    - name: Run the opt-in map and 50k topology gates
      run: Rscript -e 'devtools::test()'
