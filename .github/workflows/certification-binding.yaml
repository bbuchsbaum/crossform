name: certification-binding

# A pull request that edits R/ without re-certifying must fail: the shipped
# gate artifacts under inst/extdata/certification/ are evidence only for the
# source digest they record. benchmarks/check-certification-binding.R
# recomputes the digest and exits nonzero on any stale artifact, naming the
# runner that re-certifies it (see benchmarks/RECERTIFY.md).
#
# The check needs no package installation and no dependencies beyond digest,
# so it runs in seconds on a bare R.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - name: Install digest
      run: Rscript -e 'install.packages("digest")'
    - name: Shipped certification artifacts bind to this tree
      run: Rscript benchmarks/check-certification-binding.R
