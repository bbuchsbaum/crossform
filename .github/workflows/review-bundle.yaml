name: Scientific review bundle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      NOT_CRAN: "true"
      CROSSFORM_RUN_REVIEW_BUNDLE_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: https://bbuchsbaum.r-universe.dev
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::pkgload, any::rmarkdown
          needs: check
      - name: Rebuild, verify, and tamper-test the bundle
        run: >-
          Rscript -e
          'devtools::test(filter = "review-bundle", reporter = "summary",
          stop_on_failure = TRUE)'
