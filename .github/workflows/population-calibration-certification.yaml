name: Population calibration certification

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 12 * *"

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat
      - run: Rscript benchmarks/population-calibration/01-certify.R
      - run: git diff --exit-code -- inst/extdata/certification/population-calibration-*.csv
      - run: Rscript -e 'pkgload::load_all(".", quiet=TRUE); testthat::test_file("tests/testthat/test-population-calibration-certification.R")'
