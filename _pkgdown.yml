- title: "Population (experimental)"
  desc: >
    **Experimental.** Carrying one participant's conservative geometry onto a
    shared group node set. A transport is an *input*: crossform accepts a
    typed, sparse, provenance-bearing operator and refuses to learn one —
    image registration and functional-transport learning stay outside the
    package. The sink column is required and always materialized, so partial
    coverage is a number you can read rather than budget that quietly went
    missing, and `semantics` has no default because budget and density are
    two different estimands. A transport built from the response data must
    name the runs that built it. `plan_population()` assembles the group
    estimand from them: the transport, the budget normalization, and the fit's
    evaluation order all enter its scientific identity, because each of them
    changes what the group number is rather than how it is computed.
    `estimate_population()` executes one through a bank of contrasts, reading
    the query before the transport so complete packed geometry is never
    allocated, and asserting each participant's budget certificate at fit
    time. `materialize_population()` is its complete-form counterpart, for
    when the whole group form is wanted rather than a bank: it streams the
    packed coordinate axis in tiles, so the group stack stays linear in the
    tile and the dense participant-by-node-by-coordinate array is never
    built. `population_views` are the reader verbs over either result —
    `contrast_energy()`, `rdm()`, `rsa()` and `contribution()` again, reading
    the group coefficients that run already produced rather than executing a
    second one; a query the estimated basis cannot reach is refused with the
    re-estimation remedy instead of being projected onto it.
    `population_uncertainty()` reports the two error bars section 7 requires
    to be kept apart: the between-subject scatter of the participants about
    the group fit, and — only where a group column is fed by exactly one
    native row, so the cross-node terms carry weight zero — the transported
    within-subject sampling variance. They are separate blocks with no field
    holding their sum, and the `t` is labelled uncalibrated whatever the
    recorded null simulation measured, because a real fit adds
    misspecification and transport heterogeneity that simulation did not
    contain. `heterogeneity()` reads the other half of section 6's
    decomposition: the N-by-N subject Gram of participants' deviations from
    the group fit, its spectrum, the subject loadings on its modes and — at
    nodes you name — the geometry of those modes. It defaults to the
    cross-fitted estimator, because the plug-in one books every participant's
    within-subject sampling noise as between-participant heterogeneity and
    inflates the trace by a measured 62.7%; the plug-in route stays available
    for loading directions, named as such and carrying no effective mode
    count. `population_prevalence()` is the descriptive counterpart: how many
    participants stand behind a group value, at each group node and query and
    across the bank as a whole. It lives on the latent layer section 6.5
    confines fractions to, prints the same "not for inference" sentence
    `latent_geometry()` does, and refuses to carry a field that looks like an
    error bar — a cell at which nothing reproduces reports a fraction near
    0.5, not near 0. See
    [`design/population-form-contract.md`](https://github.com/bbuchsbaum/crossform/blob/main/design/population-form-contract.md).
  contents:
  - location_transport
  - anatomical_transport
  - external_transport
  - transport_values
  - plan_population
  - estimate_population
  - materialize_population
  - population_views
  - heterogeneity
  - population_uncertainty
  - population_prevalence

- title: Adapters
  desc: >
    Morphisms into the typed core from another package's vocabulary. Every
    dependency here is `Suggests:`, and the core is not shaped by any of
    them. The three `neuroim2` entries are de-facto core for volumetric
    work — every real imaging path begins and ends there.
  contents:
  - neuroim2_volume_domain
  - neuroim2_searchlights
  - as_neurovol
  - bids_study
  - fmridesign_design_model
  - fmrireg_relation

- title: For extension packages
  desc: >
    The five sanctioned entry points an extension or adapter *package* uses
    to hand data, a design, and an error channel into the core, plus the
    version certificate every adapter is obliged to obtain before it touches
    the package it adapts. Not an end user's surface, and deliberately small:
    everything else that once lived here is internal.
    `vignette("crossform-extending")` states what is open, what is closed, and
    what an extension may rely on remaining true.
  contents:
  - file_matrix_source
  - source_capabilities
  - effect_extractor
  - relation_fit
  - relation_block
  - adapter_version_certificate
