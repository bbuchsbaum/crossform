  - frame_family
  - frame_conservation

- title: "Advanced — metrics and crossnobis"
  desc: >
    Fixed and learned neural metrics, the leakage guard on metric training,
    and the separately qualified crossnobis path.
  contents:
  - neural_metric
  - noise_precision
  - identity_metric
  - diagonal_precision
  - shrinkage_precision
  - metric_training_policy
  - metric_capabilities
  - plan_crossnobis
  - crossnobis

- title: "Advanced — extraction maps, error channels, and residuals"
  desc: >
    Where the estimates and their error channel come from: the extraction
    map in `B = E Y`, whether a fit carries residuals at all, and the
    bounded residual read with its correct divisor.
  contents:
  - lm_extractor
  - relation_fit_capabilities
  - residual_block
  - residual_df

- title: "Advanced — numerical evidence"
  desc: >
    The reproducibility contract as a value, and the verifier that two runs
    agree under a named guarantee.
  contents:
  - numerical_contract
  - numerical_agreement

- title: "Advanced — matched-pair contrasts (provisional API)"
  desc: >
    Matched encoding–retrieval pairs, eligible controls, and the balanced
    matched-minus-control operator. **Provisional, not settled public API:**
    this family is held open pending the rectangular ER-RSA exemplar, and
    whichever of these the delivered exemplar does not exercise becomes
    internal. Do not build against it yet.
  contents:
  - match_coupling
  - control_coupling
  - coupling_contrast
  - match_control
  - pair_lm_query

- title: "Coupling and measurement (experimental, small-node only)"
  desc: >
    **Experimental.** Measurement forms, coupling closures, and tomography —
    results that relate two sets of measurements to each other rather than
    scoring one. The API and the returned kinds may change. This tier is
    **scale-gated and the package refuses brain-scale claims here**: a
    request whose dense payload exceeds the version 0.1 small-node limit of
    256 MiB (268,435,456 bytes) is refused outright rather than approximated,
    with the remedy "use the support-local geometry plan; brain-scale
    measurement tomography is not yet exported."
    `vignette("evidence-pairing")` is the narrative.
  contents:
  - measurement_frame
  - edge_frame
  - measurement_form
  - measurement_components
  - variation_query
  - coupling
  - coupling_views
  - effect_coupling_result
  - gaussian_covariance_model
  - connectivity
  - reconstruct_evidence

- title: "Population (experimental)"
  desc: >
    **Experimental.** Carrying one participant's conservative geometry onto a
    shared group node set. A transport is an *input*: crossform accepts a
    typed, sparse, provenance-bearing operator and refuses to learn one —
    image registration and functional-transport learning stay outside the
    package. The sink column is required and always materialized, so partial
    coverage is a number you can read rather than budget that quietly went
    missing, and `semantics` has no default because budget and density are
    two different estimands. A transport built from the response data must
    name the runs that built it. `plan_population()` assembles the group
    estimand from them: the transport, the budget normalization, and the fit's
    evaluation order all enter its scientific identity, because each of them
    changes what the group number is rather than how it is computed. See
    [`design/population-form-contract.md`](https://github.com/bbuchsbaum/crossform/blob/main/design/population-form-contract.md).
  contents:
  - location_transport
  - anatomical_transport
  - external_transport
  - transport_values
  - plan_population

- title: Adapters
  desc: >
    Morphisms into the typed core from another package's vocabulary. Every
    dependency here is `Suggests:`, and the core is not shaped by any of
    them. The three `neuroim2` entries are de-facto core for volumetric
    work — every real imaging path begins and ends there.
  contents:
  - neuroim2_volume_domain
  - neuroim2_searchlights
  - as_neurovol
  - bids_study
  - fmridesign_design_model
  - fmrireg_relation

- title: For extension packages
  desc: >
    The five sanctioned entry points an extension or adapter *package* uses
    to hand data, a design, and an error channel into the core. Not an end
    user's surface, and deliberately small: everything else that once lived
    here is internal. `vignette("crossform-extending")` states what is open,
    what is closed, and what an extension may rely on remaining true.
  contents:
  - file_matrix_source
  - source_capabilities
  - effect_extractor
  - relation_fit
  - relation_block
