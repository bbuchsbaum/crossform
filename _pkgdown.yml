- title: "Advanced — the latent PSD layer"
  desc: >
    Crossvalidated contributions are signed, and effective counts, cumulative
    curves and contribution fractions are invalid on them: the implied shares
    can leave `[0, 1]`, and clipping reintroduces the bias the cross-partition
    estimator removes. Those functionals are legal only on a declared
    nonnegative projection, which this builds and labels — a named projection
    from a closed set, with the mass it moved reported per measurement rather
    than absorbed.
  contents:
  - latent_geometry

