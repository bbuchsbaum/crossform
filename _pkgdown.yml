- title: Conservative geometry
  desc: >
    The attribution instrument. A conservative frame partitions one fixed
    global budget instead of reporting a density per neighbourhood, so its map
    is a ledger that adds up over territories — and its per-scale totals are
    the analyst's own weights, which is why the coherence spectrum, not the
    energy spectrum, is the finding.
  contents:
  - conservative-frames

- title: Population (experimental)
  desc: >
    Experimental. Carrying each participant's conservative ledger onto a
    shared group node set: the typed transport you supply and the package
    refuses to learn, the sink column that makes partial coverage a number
    you read rather than budget that went missing, the commutation that makes
    modelling-then-querying the same answer as querying-then-modelling, the
    cross-fitted subject Gram that separates consensus from disagreement, and
    the two error bars the layer keeps apart and labels uncalibrated.
  contents:
  - population-form

