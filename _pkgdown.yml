  - contribution
  - coherence_spectrum
  - rdm
  - rsa
  - plot_views
  - sampling_capabilities
  - rdm_sampling_covariance
  - sampling_covariance
  - catch_refusal
  - crossform_conditions
  - compute_policy

- title: "Core (ingestion) — from observations to a fitted relation"
  desc: >
    The typed-facts spine, for arriving with scan responses and an event
